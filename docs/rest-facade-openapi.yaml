openapi: 3.1.0
info:
  title: sanctions-screening-mcp-server REST facade
  version: 0.1.11
  description: |
    Stable REST facade for SAP/CAP backend integration over the existing
    screening engine. This facade is deterministic and backend-focused;
    it does not replace the MCP interface for agent tooling.

    Contract notes:
    - Default server-side timeout target: 30000ms.
    - POST routes should include Idempotency-Key when callers may retry.
    - Screening returns potential matches only, never a compliance decision.
servers:
  - url: http://localhost:3011/api/v1
    description: Local development example when MCP_HTTP_PORT=3010

tags:
  - name: Screening
  - name: Sources
  - name: Exceptions

paths:
  /sources:
    get:
      tags: [Sources]
      summary: List source readiness and provenance
      operationId: listSources
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Mirror readiness, freshness timestamps, and source details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /screening/business-partner:
    post:
      tags: [Screening]
      summary: Screen one business partner name
      description: |
        Screens a business partner name against the selected sanctions sources.
        The response contains potential matches only. It is a screening aid,
        not a compliance determination.
      operationId: screenBusinessPartner
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPartnerScreenRequest'
      responses:
        '200':
          description: Screening response with candidates ordered by relevance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPartnerScreenResponse'
        '400':
          description: Invalid request payload or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Local sanctions mirror not initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /screening/business-partner/{bpId}/history:
    get:
      tags: [Screening]
      summary: Fetch screening history for one business partner
      operationId: getBusinessPartnerHistory
      x-implementation-status: planned
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BpIdPath'
      responses:
        '200':
          description: History entries for the requested business partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPartnerHistoryResponse'
        '501':
          description: Endpoint contract is defined but not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedResponse'

  /screening/batch:
    post:
      tags: [Screening]
      summary: Submit a batch screening request
      operationId: submitScreeningBatch
      x-implementation-status: planned
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchScreenRequest'
      responses:
        '202':
          description: Batch accepted for async processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchScreenAcceptedResponse'
        '501':
          description: Endpoint contract is defined but not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedResponse'

  /exceptions/{bpId}:
    get:
      tags: [Exceptions]
      summary: List exceptions for one business partner
      operationId: listBusinessPartnerExceptions
      x-implementation-status: planned
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BpIdPath'
      responses:
        '200':
          description: Exceptions/whitelist entries for the partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionListResponse'
        '501':
          description: Endpoint contract is defined but not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedResponse'
    post:
      tags: [Exceptions]
      summary: Create an exception for one business partner
      operationId: createBusinessPartnerException
      x-implementation-status: planned
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BpIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExceptionRequest'
      responses:
        '201':
          description: Exception created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExceptionResponse'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Endpoint contract is defined but not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedResponse'

components:
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-supplied request correlation id.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Recommended for retry-safe POST calls.
      schema:
        type: string
        minLength: 1
    BpIdPath:
      name: bpId
      in: path
      required: true
      description: Business partner id in the caller source system.
      schema:
        type: string
        minLength: 1

  schemas:
    BusinessPartnerScreenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        bpId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 2
          maxLength: 2
        role:
          type: string
          enum: [customer, vendor, other]
        entityType:
          type: string
          enum: [any, person, organization, vessel, aircraft]
          default: any
        matchMode:
          type: string
          enum: [strict, fuzzy]
          default: strict
        minScore:
          type: number
          minimum: 0
          maximum: 1
        sources:
          type: array
          items:
            type: string
            enum: [ofac_sdn, ofac_consolidated, eu, uk, un]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        offset:
          type: integer
          minimum: 0
          default: 0

    BusinessPartnerScreenResponse:
      type: object
      required: [businessPartner, screening, pagination, hits, caveat]
      properties:
        businessPartner:
          type: object
          required: [name]
          properties:
            bpId: { type: string }
            name: { type: string }
            country: { type: string }
            role: { type: string }
        screening:
          type: object
          required: [normalizedQuery, requestedMatchMode, matchModeUsed, entityType, sources]
          properties:
            normalizedQuery: { type: string }
            requestedMatchMode: { type: string }
            matchModeUsed: { type: string }
            entityType: { type: string }
            minScore: { type: number }
            sources:
              type: array
              items: { type: string }
        pagination:
          type: object
          required: [limit, offset, returned, totalAvailable, totalAvailableBasis, hasMore]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            returned: { type: integer }
            totalAvailable: { type: integer }
            totalAvailableBasis: { type: string }
            hasMore: { type: boolean }
            nextOffset: { type: integer }
        hits:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningHit'
        notice:
          type: string
        caveat:
          type: string
          description: Screening aid caveat from the screening engine.

    ScreeningHit:
      type: object
      required:
        - source
        - sourceLabel
        - sourceEntryId
        - entityType
        - primaryName
        - matchedName
        - matchedNameType
        - matchType
      properties:
        source: { type: string }
        sourceLabel: { type: string }
        sourceEntryId: { type: string }
        entityType: { type: string }
        primaryName: { type: string }
        matchedName: { type: string }
        matchedNameType: { type: string }
        matchType:
          type: string
          enum: [exact, strong, approximate]
        score:
          type: number
          minimum: 0
          maximum: 1
        queryTokenCoverage:
          type: object
          properties:
            matched: { type: integer }
            total: { type: integer }
        program: { type: string }
        designationDate:
          type: string
          format: date

    SourcesResponse:
      type: object
      required: [sanctionsReady, leiReady, sources]
      properties:
        sanctionsReady: { type: boolean }
        sanctionsAsOf:
          type: string
          format: date-time
        leiReady: { type: boolean }
        leiAsOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: object
            required: [code, label, recordCount, url, license]
            properties:
              code: { type: string }
              label: { type: string }
              recordCount: { type: integer }
              url:
                type: string
                format: uri
              license: { type: string }

    BusinessPartnerHistoryResponse:
      type: object
      required: [bpId, events]
      properties:
        bpId: { type: string }
        events:
          type: array
          items:
            type: object
            properties:
              eventId: { type: string }
              executedAt:
                type: string
                format: date-time
              matchMode: { type: string }
              hitCount: { type: integer }
              status: { type: string }

    BatchScreenRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [name]
            properties:
              bpId: { type: string }
              name: { type: string }
              country: { type: string }
              role: { type: string }

    BatchScreenAcceptedResponse:
      type: object
      required: [batchId, status]
      properties:
        batchId: { type: string }
        status:
          type: string
          enum: [accepted]

    ExceptionListResponse:
      type: object
      required: [bpId, exceptions]
      properties:
        bpId: { type: string }
        exceptions:
          type: array
          items:
            type: object
            properties:
              exceptionId: { type: string }
              sourceEntryId: { type: string }
              justification: { type: string }
              validFrom:
                type: string
                format: date
              validUntil:
                type: string
                format: date
              status: { type: string }

    CreateExceptionRequest:
      type: object
      additionalProperties: false
      required: [sourceEntryId, justification]
      properties:
        sourceEntryId:
          type: string
          minLength: 1
        justification:
          type: string
          minLength: 1
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date

    CreateExceptionResponse:
      type: object
      required: [bpId, exceptionId, status]
      properties:
        bpId: { type: string }
        exceptionId: { type: string }
        status:
          type: string
          enum: [created]

    NotImplementedResponse:
      type: object
      required: [error, contract]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        contract:
          type: object
          required: [timeoutMs, idempotencyHeader]
          properties:
            timeoutMs:
              type: integer
              example: 30000
            idempotencyHeader:
              type: string
              example: Idempotency-Key

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - mirror_not_ready
            - not_found
            - history_not_implemented
            - batch_not_implemented
            - exceptions_not_implemented
            - internal_error
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        recovery:
          type: string
