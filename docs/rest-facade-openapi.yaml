openapi: 3.1.0
info:
  title: sanctions-screening-mcp-server REST facade
  version: 0.1.11
  description: |
    Stable REST facade for SAP/CAP backend integration over the existing
    screening engine. This facade is deterministic and backend-focused;
    it does not replace the MCP interface for agent tooling.

    Contract notes:
    - Default server-side timeout target: 30000ms.
    - POST routes should include Idempotency-Key when callers may retry.
    - Screening returns potential matches only, never a compliance decision.
servers:
  - url: http://localhost:3011/api/v1
    description: Local development example when MCP_HTTP_PORT=3010

tags:
  - name: Screening
  - name: Sources
  - name: Designations
  - name: Exceptions
  - name: SapIntegration
  - name: ComplianceCases

paths:
  /sources:
    get:
      tags: [Sources]
      summary: List source readiness and provenance
      operationId: listSources
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Mirror readiness, freshness timestamps, and source details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /designations/{source}/{entryId}:
    get:
      tags: [Designations]
      summary: Fetch one full designation record by source and entry id
      description: |
        Returns one normalized designation detail record, including aliases,
        identifiers, addresses, and vessel metadata when published (for example
        vessel flag and vessel type).
      operationId: getDesignationDetails
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SourceCodePath'
        - $ref: '#/components/parameters/EntryIdPath'
      responses:
        '200':
          description: Designation details for the requested source and entry id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignationDetailsResponse'
        '404':
          description: Designation id not found in the mirror.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Local sanctions mirror not initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /screening/business-partner:
    post:
      tags: [Screening]
      summary: Screen one business partner name
      description: |
        Screens a business partner name against the selected sanctions sources.
        The response contains potential matches only. It is a screening aid,
        not a compliance determination.
      operationId: screenBusinessPartner
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPartnerScreenRequest'
      responses:
        '200':
          description: Screening response with candidates ordered by relevance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPartnerScreenResponse'
        '400':
          description: Invalid request payload or malformed JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Local sanctions mirror not initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /screening/business-partner/{bpId}/history:
    get:
      tags: [Screening]
      summary: Fetch screening history for one business partner
      operationId: getBusinessPartnerHistory
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BpIdPath'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: History entries for the requested business partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPartnerHistoryResponse'

  /screening/batch:
    post:
      tags: [Screening]
      summary: Submit a batch screening request
      operationId: submitScreeningBatch
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchScreenRequest'
      responses:
        '202':
          description: Batch accepted for async processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchScreenAcceptedResponse'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integration/sap/ecc/business-partner-changed:
    post:
      tags: [SapIntegration]
      summary: Receive an ECC business-partner change trigger and screen immediately
      operationId: handleSapEccBusinessPartnerChanged
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SapEccBusinessPartnerChangedRequest'
      responses:
        '200':
          description: Trigger accepted and screened in-process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapRealtimeScreeningResponse'
        '400':
          description: Invalid ECC integration payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Local sanctions mirror not initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integration/sap/s4/business-partner-changed:
    post:
      tags: [SapIntegration]
      summary: Receive an S/4HANA event payload and screen immediately
      operationId: handleSapS4BusinessPartnerChanged
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SapS4BusinessPartnerChangedRequest'
      responses:
        '200':
          description: Event accepted and screened in-process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapRealtimeScreeningResponse'
        '400':
          description: Invalid S/4 integration payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Local sanctions mirror not initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integration/sap/batch-business-partners:
    post:
      tags: [SapIntegration]
      summary: Receive a SAP-driven batch and process screenings in-process
      operationId: handleSapBatchBusinessPartners
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SapBatchBusinessPartnersRequest'
      responses:
        '202':
          description: Batch accepted and processed in-process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapBatchAcceptedResponse'
        '400':
          description: Invalid SAP batch payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /exceptions/{bpId}:
    get:
      tags: [Exceptions]
      summary: List exceptions for one business partner
      operationId: listBusinessPartnerExceptions
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/BpIdPath'
      responses:
        '200':
          description: Exceptions/whitelist entries for the partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionListResponse'
    post:
      tags: [Exceptions]
      summary: Create an exception for one business partner
      operationId: createBusinessPartnerException
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/BpIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExceptionRequest'
      responses:
        '201':
          description: Exception created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExceptionResponse'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /compliance/cases:
    get:
      tags: [ComplianceCases]
      summary: List compliance cases created from screening hits
      operationId: listComplianceCases
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_review, pending_approval, closed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Case worklist with paging metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCaseListResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /compliance/cases/{caseId}:
    get:
      tags: [ComplianceCases]
      summary: Fetch one compliance case with hits and decisions
      operationId: getComplianceCase
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CaseIdPath'
      responses:
        '200':
          description: Complete compliance case details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCaseResponse'
        '404':
          description: Case id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /compliance/cases/{caseId}/decision:
    post:
      tags: [ComplianceCases]
      summary: Record a manual case decision with optional four-eyes approval
      operationId: decideComplianceCase
      x-implementation-status: implemented
      x-timeout-ms: 30000
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CaseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceCaseDecisionRequest'
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCaseDecisionResponse'
        '400':
          description: Invalid payload or four-eyes rule violated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Case id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-supplied request correlation id.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Recommended for retry-safe POST calls.
      schema:
        type: string
        minLength: 1
    BpIdPath:
      name: bpId
      in: path
      required: true
      description: Business partner id in the caller source system.
      schema:
        type: string
        minLength: 1
    SourceCodePath:
      name: source
      in: path
      required: true
      description: Source-list code of the designation.
      schema:
        type: string
        enum: [ofac_sdn, ofac_consolidated, eu, uk, un, us_bis_entity, us_bis_dpl, us_bis_unverified]
    EntryIdPath:
      name: entryId
      in: path
      required: true
      description: Source-native designation entry id.
      schema:
        type: string
        minLength: 1
    CaseIdPath:
      name: caseId
      in: path
      required: true
      description: Compliance case identifier.
      schema:
        type: string
        minLength: 1

  schemas:
    BusinessPartnerScreenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        bpId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 2
          maxLength: 2
        role:
          type: string
          enum: [customer, vendor, other]
        entityType:
          type: string
          enum: [any, person, organization, vessel, aircraft]
          default: any
        matchMode:
          type: string
          enum: [strict, fuzzy]
          default: strict
        minScore:
          type: number
          minimum: 0
          maximum: 1
        sources:
          type: array
          items:
            type: string
            enum: [ofac_sdn, ofac_consolidated, eu, uk, un, us_bis_entity, us_bis_dpl, us_bis_unverified]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        offset:
          type: integer
          minimum: 0
          default: 0

    BusinessPartnerScreenResponse:
      type: object
      required: [businessPartner, screening, pagination, hits, caveat]
      properties:
        businessPartner:
          type: object
          required: [name]
          properties:
            bpId: { type: string }
            name: { type: string }
            country: { type: string }
            role: { type: string }
        screening:
          type: object
          required: [normalizedQuery, requestedMatchMode, matchModeUsed, entityType, sources]
          properties:
            normalizedQuery: { type: string }
            requestedMatchMode: { type: string }
            matchModeUsed: { type: string }
            entityType: { type: string }
            minScore: { type: number }
            sources:
              type: array
              items: { type: string }
            sourcesAsOf:
              type: string
              format: date-time
        pagination:
          type: object
          required: [limit, offset, returned, totalAvailable, totalAvailableBasis, hasMore]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            returned: { type: integer }
            totalAvailable: { type: integer }
            totalAvailableBasis: { type: string }
            hasMore: { type: boolean }
            nextOffset: { type: integer }
        hits:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningHit'
        notice:
          type: string
        caveat:
          type: string
          description: Screening aid caveat from the screening engine.

    ScreeningHit:
      type: object
      required:
        - source
        - sourceLabel
        - sourceEntryId
        - entityType
        - primaryName
        - matchedName
        - matchedNameType
        - matchType
      properties:
        source: { type: string }
        sourceLabel: { type: string }
        sourceEntryId: { type: string }
        entityType: { type: string }
        primaryName: { type: string }
        matchedName: { type: string }
        matchedNameType: { type: string }
        matchType:
          type: string
          enum: [exact, strong, approximate]
        score:
          type: number
          minimum: 0
          maximum: 1
        queryTokenCoverage:
          type: object
          properties:
            matched: { type: integer }
            total: { type: integer }
        program: { type: string }
        designationDate:
          type: string
          format: date

    VesselDetails:
      type: object
      required: [callSigns, formerFlags]
      properties:
        flag: { type: string }
        formerFlags:
          type: array
          items: { type: string }
        vesselType: { type: string }
        callSigns:
          type: array
          items: { type: string }
        tonnage: { type: string }
        grossRegisteredTonnage: { type: string }

    DesignationDetails:
      type: object
      required:
        - source
        - sourceLabel
        - sourceEntryId
        - entityType
        - primaryName
        - aliases
        - identifiers
        - addresses
        - datesOfBirth
        - nationalities
        - caveat
      properties:
        source:
          type: string
          enum: [ofac_sdn, ofac_consolidated, eu, uk, un, us_bis_entity, us_bis_dpl, us_bis_unverified]
        sourceLabel: { type: string }
        sourceEntryId: { type: string }
        entityType:
          type: string
          enum: [person, organization, vessel, aircraft, unknown]
        primaryName: { type: string }
        program: { type: string }
        legalBasis: { type: string }
        designationDate:
          type: string
          format: date
        aliases:
          type: array
          items:
            type: object
            required: [name, nameType]
            properties:
              name: { type: string }
              nameType:
                type: string
                enum: [primary, aka, fka, low-quality-aka]
        identifiers:
          type: array
          items:
            type: object
            required: [type, value]
            properties:
              type: { type: string }
              value: { type: string }
              country: { type: string }
        addresses:
          type: array
          items:
            type: object
            required: [full]
            properties:
              full: { type: string }
              country: { type: string }
        datesOfBirth:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              place: { type: string }
        nationalities:
          type: array
          items: { type: string }
        vesselDetails:
          $ref: '#/components/schemas/VesselDetails'
        remarks: { type: string }
        caveat: { type: string }

    DesignationDetailsResponse:
      type: object
      required: [designation]
      properties:
        designation:
          $ref: '#/components/schemas/DesignationDetails'

    SourcesResponse:
      type: object
      required: [sanctionsReady, leiReady, sources]
      properties:
        sanctionsReady: { type: boolean }
        sanctionsAsOf:
          type: string
          format: date-time
        leiReady: { type: boolean }
        leiAsOf:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: object
            required: [code, label, recordCount, url, license]
            properties:
              code: { type: string }
              label: { type: string }
              recordCount: { type: integer }
              url:
                type: string
                format: uri
              license: { type: string }

    BusinessPartnerHistoryResponse:
      type: object
      required: [bpId, pagination, events]
      properties:
        bpId: { type: string }
        pagination:
          type: object
          required: [limit, offset, returned, totalAvailable, hasMore]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            returned: { type: integer }
            totalAvailable: { type: integer }
            hasMore: { type: boolean }
            nextOffset: { type: integer }
        events:
          type: array
          items:
            type: object
            required:
              - eventId
              - bpId
              - queryName
              - matchMode
              - matchModeUsed
              - entityType
              - sourcesQueried
              - executedAt
              - hitCount
              - screeningStatus
            properties:
              eventId: { type: string }
              bpId: { type: string }
              queryName: { type: string }
              executedAt:
                type: string
                format: date-time
              matchMode: { type: string }
              matchModeUsed: { type: string }
              entityType: { type: string }
              sourcesQueried:
                type: array
                items: { type: string }
              sourcesAsOf:
                type: string
                format: date-time
              hitCount: { type: integer }
              screeningStatus:
                type: string
                enum: [screened, not_ready, error]

    BatchScreenRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              bpId: { type: string }
              name: { type: string }
              country:
                type: string
                minLength: 2
                maxLength: 2
              role:
                type: string
                enum: [customer, vendor, other]
        screening:
          type: object
          properties:
            entityType:
              type: string
              enum: [any, person, organization, vessel, aircraft]
              default: any
            matchMode:
              type: string
              enum: [strict, fuzzy]
              default: strict
            minScore:
              type: number
              minimum: 0
              maximum: 1
            sources:
              type: array
              items:
                type: string
                enum: [ofac_sdn, ofac_consolidated, eu, uk, un, us_bis_entity, us_bis_dpl, us_bis_unverified]
            limit:
              type: integer
              minimum: 1
              maximum: 100
              default: 25

    BatchScreenAcceptedResponse:
      type: object
      required:
        - batchId
        - status
        - acceptedAt
        - acceptedCount
        - processedCount
        - failedCount
        - note
        - caveat
      properties:
        batchId: { type: string }
        status:
          type: string
          enum: [accepted]
        acceptedAt:
          type: string
          format: date-time
        acceptedCount: { type: integer }
        processedCount: { type: integer }
        failedCount: { type: integer }
        note: { type: string }
        caveat: { type: string }

    ExceptionListResponse:
      type: object
      required: [bpId, exceptions]
      properties:
        bpId: { type: string }
        exceptions:
          type: array
          items:
            type: object
            required:
              - exceptionId
              - sourceEntryId
              - justification
              - status
              - createdAt
            properties:
              exceptionId: { type: string }
              sourceEntryId: { type: string }
              justification: { type: string }
              validFrom:
                type: string
                format: date
              validUntil:
                type: string
                format: date
              status: { type: string }
              createdAt:
                type: string
                format: date-time

    CreateExceptionRequest:
      type: object
      additionalProperties: false
      required: [sourceEntryId, justification]
      properties:
        sourceEntryId:
          type: string
          minLength: 1
        justification:
          type: string
          minLength: 1
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date

    CreateExceptionResponse:
      type: object
      required: [bpId, exceptionId, status, exception]
      properties:
        bpId: { type: string }
        exceptionId: { type: string }
        status:
          type: string
          enum: [created]
        exception:
          type: object
          required:
            - exceptionId
            - sourceEntryId
            - justification
            - status
            - createdAt
          properties:
            exceptionId: { type: string }
            sourceEntryId: { type: string }
            justification: { type: string }
            validFrom:
              type: string
              format: date
            validUntil:
              type: string
              format: date
            status:
              type: string
              enum: [active]
            createdAt:
              type: string
              format: date-time

    ComplianceCaseListResponse:
      type: object
      required: [pagination, cases]
      properties:
        pagination:
          type: object
          required: [limit, offset, returned, totalAvailable, hasMore]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            returned: { type: integer }
            totalAvailable: { type: integer }
            hasMore: { type: boolean }
            nextOffset: { type: integer }
        cases:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceCaseSummary'

    ComplianceCaseSummary:
      type: object
      required:
        - caseId
        - bpId
        - businessPartnerName
        - status
        - priority
        - createdAt
        - updatedAt
        - latestEventId
        - hitCount
        - openHitCount
      properties:
        caseId: { type: string }
        bpId: { type: string }
        businessPartnerName: { type: string }
        status:
          type: string
          enum: [open, in_review, pending_approval, closed]
        priority:
          type: string
          enum: [low, medium, high]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestEventId: { type: string }
        hitCount: { type: integer }
        openHitCount: { type: integer }

    ComplianceCaseResponse:
      type: object
      required: [case]
      properties:
        case:
          $ref: '#/components/schemas/ComplianceCase'

    ComplianceCase:
      type: object
      required:
        - caseId
        - bpId
        - businessPartnerName
        - status
        - priority
        - createdAt
        - updatedAt
        - latestEventId
        - eventIds
        - hits
        - decisions
      properties:
        caseId: { type: string }
        bpId: { type: string }
        businessPartnerName: { type: string }
        status:
          type: string
          enum: [open, in_review, pending_approval, closed]
        priority:
          type: string
          enum: [low, medium, high]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestEventId: { type: string }
        eventIds:
          type: array
          items: { type: string }
        hits:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceCaseHit'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceCaseDecision'

    ComplianceCaseHit:
      type: object
      required:
        - hitId
        - source
        - sourceEntryId
        - matchedName
        - matchType
        - reviewStatus
      properties:
        hitId: { type: string }
        source: { type: string }
        sourceEntryId: { type: string }
        matchedName: { type: string }
        matchType:
          type: string
          enum: [exact, strong, approximate]
        score:
          type: number
          minimum: 0
          maximum: 1
        reviewStatus:
          type: string
          enum: [open, confirmed_match, false_positive, escalated]

    ComplianceCaseDecision:
      type: object
      required:
        - decisionId
        - decision
        - decidedBy
        - proposedBy
        - requiresFourEyes
        - approvalStatus
        - decidedAt
      properties:
        decisionId: { type: string }
        decision:
          type: string
          enum: [confirmed_match, false_positive, escalate]
        decidedBy: { type: string }
        proposedBy: { type: string }
        approvedBy: { type: string }
        comment: { type: string }
        requiresFourEyes: { type: boolean }
        approvalStatus:
          type: string
          enum: [not_required, pending, approved]
        decidedAt:
          type: string
          format: date-time

    ComplianceCaseDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, decidedBy]
      properties:
        decision:
          type: string
          enum: [confirmed_match, false_positive, escalate]
        decidedBy:
          type: string
          minLength: 1
        proposedBy:
          type: string
          minLength: 1
        approvedBy:
          type: string
          minLength: 1
        comment:
          type: string
          minLength: 1

    ComplianceCaseDecisionResponse:
      type: object
      required: [caseId, status, decision, note]
      properties:
        caseId: { type: string }
        status:
          type: string
          enum: [open, in_review, pending_approval, closed]
        decision:
          $ref: '#/components/schemas/ComplianceCaseDecision'
        note:
          type: string

    SapBusinessPartner:
      type: object
      additionalProperties: false
      required: [bpId, name]
      properties:
        bpId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 2
          maxLength: 2
        role:
          type: string
          enum: [customer, vendor, other]

    SapIntegrationScreeningOptions:
      type: object
      additionalProperties: false
      properties:
        entityType:
          type: string
          enum: [any, person, organization, vessel, aircraft]
          default: any
        matchMode:
          type: string
          enum: [strict, fuzzy]
          default: strict
        minScore:
          type: number
          minimum: 0
          maximum: 1
        sources:
          type: array
          items:
            type: string
            enum: [ofac_sdn, ofac_consolidated, eu, uk, un, us_bis_entity, us_bis_dpl, us_bis_unverified]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25

    SapEccBusinessPartnerChangedRequest:
      type: object
      additionalProperties: false
      required: [sourceSystem, triggerType, businessPartner]
      properties:
        sourceSystem:
          type: string
          enum: [ecc]
        triggerType:
          type: string
          enum: [badi, change_document, manual]
        businessPartner:
          $ref: '#/components/schemas/SapBusinessPartner'
        screening:
          $ref: '#/components/schemas/SapIntegrationScreeningOptions'
        context:
          type: object
          additionalProperties: false
          properties:
            changeDocumentId:
              type: string
              minLength: 1
            iflowMessageId:
              type: string
              minLength: 1

    SapS4BusinessPartnerChangedRequest:
      type: object
      additionalProperties: false
      required: [sourceSystem, eventType, businessPartner]
      properties:
        sourceSystem:
          type: string
          enum: [s4hana]
        eventType:
          type: string
          minLength: 1
        eventId:
          type: string
          minLength: 1
        businessPartner:
          $ref: '#/components/schemas/SapBusinessPartner'
        screening:
          $ref: '#/components/schemas/SapIntegrationScreeningOptions'
        context:
          type: object
          additionalProperties: false
          properties:
            communicationArrangement:
              type: string
              minLength: 1

    SapBatchBusinessPartnersRequest:
      type: object
      additionalProperties: false
      required: [sourceSystem, items]
      properties:
        sourceSystem:
          type: string
          enum: [ecc, s4hana]
        triggeredBy:
          type: string
          minLength: 1
        runId:
          type: string
          minLength: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SapBusinessPartner'
        screening:
          $ref: '#/components/schemas/SapIntegrationScreeningOptions'

    SapRealtimeScreeningResponse:
      type: object
      required: [integration, result]
      properties:
        integration:
          type: object
          required: [sourceSystem, mode, receivedAt]
          properties:
            sourceSystem:
              type: string
              enum: [ecc, s4hana]
            triggerType:
              type: string
            eventType:
              type: string
            eventId:
              type: string
            mode:
              type: string
              enum: [realtime]
            receivedAt:
              type: string
              format: date-time
            context:
              type: object
              additionalProperties: true
        result:
          $ref: '#/components/schemas/BusinessPartnerScreenResponse'

    SapBatchAcceptedResponse:
      type: object
      required:
        - integration
        - batchId
        - status
        - acceptedAt
        - acceptedCount
        - processedCount
        - failedCount
        - failedItems
        - note
        - caveat
      properties:
        integration:
          type: object
          required: [sourceSystem, mode]
          properties:
            sourceSystem:
              type: string
              enum: [ecc, s4hana]
            mode:
              type: string
              enum: [batch]
            triggeredBy:
              type: string
        batchId:
          type: string
        status:
          type: string
          enum: [accepted]
        acceptedAt:
          type: string
          format: date-time
        acceptedCount:
          type: integer
        processedCount:
          type: integer
        failedCount:
          type: integer
        failedItems:
          type: array
          items:
            type: object
            required: [bpId, reason, code]
            properties:
              bpId:
                type: string
              reason:
                type: string
              code:
                type: string
        note:
          type: string
        caveat:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - mirror_not_ready
            - not_found
            - internal_error
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        recovery:
          type: string
